{% extends "base.html" %}
{% load static %}

{% block title %}JJT — Login{% endblock %}

{% block content %}

<div class="auth-container fade-in">
  <div class="auth-card">
    <h1 class="auth-title">Acessar</h1>

    {% if login_form.non_field_errors %}
      <div class="auth-error">
        Usuário ou senha inválidos.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="form-grid" style="grid-template-columns:1fr;">
        <div class="form-group">
          <label for="id_username" class="form-label">Usuário</label>
          <input type="text" name="username" id="id_username"
                 class="form-input" placeholder="Seu usuário" required>
        </div>

        <div class="form-group">
          <label for="id_password" class="form-label">Senha</label>
          <input type="password" name="password" id="id_password"
                 class="form-input" placeholder="Sua senha" required>
        </div>
      </div>

      <div class="form-actions" style="border-top:none;margin-top:var(--space-lg);padding-top:0;">
        <button type="submit" class="btn btn-red">Entrar</button>
      </div>
    </form>

    <div class="auth-footer">
      Não tem conta? <a href="{% url 'register' %}">Registre-se</a>
    </div>
  </div>
</div>

{% endblock %}
