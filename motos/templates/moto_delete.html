{% extends "base.html" %}
{% load static %}

{% block title %}JJT — Deletar Moto{% endblock %}

{% block content %}

<div class="delete-container fade-in">
  <div class="delete-card">
    <div class="delete-icon">&#9888;</div>
    <h1 class="delete-title">Deletar Moto</h1>
    <p class="delete-text">
      Tem certeza que deseja deletar a moto<br>
      <strong>{{ object.brand }} {{ object.model }}</strong>?
    </p>
    <p style="font-size:12px;color:var(--warning-red);margin-bottom:var(--space-lg);">
      Esta ação não pode ser desfeita.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="delete-actions">
        <button type="submit" class="btn btn-danger">Sim, Deletar</button>
        <a href="{% url 'moto_update' pk=object.pk %}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
